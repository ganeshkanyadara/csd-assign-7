# Reverse Proxy & Web Server Configuration for Proximity Search Stack
server {
    listen 80;
    server_name localhost;

    # Support up to 20MB for link.txt graph uploads
    client_max_body_size 20M;

    # Enable gzip compression for API responses and static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Static Frontend Web Dashboard
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to the 'api' backend container
    location ~ ^/(search|health|docs|openapi.json) {
        proxy_pass http://api:6000;
        proxy_http_version 1.1;

        # Forward real client information and host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection and read timeouts for large graph traversals
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
