services:
  # ============================================================================
  # Service 1: Proximity Search API (FastAPI + Uvicorn)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proximity_api
    restart: unless-stopped
    environment:
      - PORT=6000
      - HOST=0.0.0.0
      - WORKERS=2
      - LOCATIONS_FILE=/app/locations.csv
      - LINK_FILE=/app/link.txt
      - PYTHONUNBUFFERED=1
    ports:
      - "6000:6000"
    volumes:
      - ./locations.csv:/app/locations.csv:ro
      - ./link.txt:/app/link.txt:ro
    networks:
      - proximity_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Service 2: Web Gateway & Reverse Proxy (Nginx + Interactive Dashboard)
  # ============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: proximity_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "6214:80"
    volumes:
      - ./web/static:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proximity_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3


# ==============================================================================
# Isolated Bridge Network for Inter-Container Communication
# ==============================================================================
networks:
  proximity_net:
    name: proximity_net
    driver: bridge
